# Builds and publishes the api and web images for this fork to GHCR:
#   ghcr.io/<owner>/opengym-api   ghcr.io/<owner>/opengym-web
# Pull requests never reach this workflow; test.yml builds the api image for them without pushing.
name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
    # Only rebuild when something that ends up in an image changes. GitHub does not evaluate
    # path filters on tag pushes, so a v* tag always publishes.
    paths:
      - 'api/**'
      - 'web/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  # A newer main push supersedes an older one; a release tag build always runs to completion.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      # arm64 is built under QEMU on the amd64 runner. The web build stage runs natively
      # ($BUILDPLATFORM), so only the api's npm install and the nginx stage are emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags:
      #   main push        -> latest, sha-<short>
      #   v1.2.3 tag push  -> v1.2.3, 1.2.3, 1.2, sha-<short>   (never latest)
      #   manual run       -> sha-<short>, plus latest only when run on main
      # Pre-release tags (v1.2.3-rc.1) get their exact tag only; 1.2 stays on the last stable.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/opengym-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
